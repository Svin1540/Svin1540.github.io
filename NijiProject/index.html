<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Nijisanji Daily Wordle Game</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="stylesheet" href="mobile.css" media="(max-width: 600px)" />
    </head>

    <body>
        <div class="header">
            <!-- <h2 class="logo">Daily</h2> -->

            <div class="nav">
                <a href="index.html" id="nav-daily" class="active">Daily</a>
                <a href="random.html" id="nav-random">Random</a>
                <a href="color.html" id="nav-color">Color</a>
                <a href="colorrandom.html" id="nav-color">Color Random</a>
                <button id="open-settings">⚙️ Settings</button>
            </div>
        </div>

        <div class="container">
            <h1>Character Guess</h1>

            <div id="top-panel">
                <!-- Character image -->
                <div id="answer-display" class="hidden">
                    <img id="answer-image" src="" />
                </div>

                <!-- Status -->
                <div id="status" class="hidden"></div>

                <!-- Timer OR New Game -->
                <div id="after-game" class="hidden">
                    <span id="timer"></span>
                    <button
                        id="new-round-btn"
                        class="hidden"
                        onclick="newRound()"
                    >
                        New Game
                    </button>
                </div>

                <!-- Streak (always visible) -->
                <div id="streak-container">
                    🔥 Streak:
                    <span id="streak">0</span>
                </div>
            </div>

            <div class="dropdown">
                <input
                    type="text"
                    id="search"
                    placeholder="Search character..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
                    name="search_fake"
                    onfocus="showDropdown()"
                    oninput="filterList()"
                />
                <div id="options" class="options hidden"></div>
            </div>

            <table id="result">
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Height</th>
                    <th>Debut</th>
                    <th>Birthday</th>
                    <th>Branch</th>
                </tr>
            </table>
        </div>

        <div
            id="modalOverlay"
            class="modal-overlay hidden"
            onclick="closeSettings(event)"
        >
            <div class="modal-box">
                <!-- Navigation -->
                <nav class="modal-nav">
                    <button onclick="showModalPage(0)">Settings</button>
                    <button onclick="showModalPage(1)">Characters</button>
                </nav>

                <!-- Page 1 -->
                <section class="modal-page" id="modalPage0">
                    <div class="category">
                        <h3 onclick="toggleCategory(this)">General</h3>

                        <div class="category-content">
                            <label>
                                <input type="checkbox" />
                                Enable notifications
                            </label>

                            <label>
                                <input type="checkbox" />
                                Show animations
                            </label>

                            <label>
                                <input type="checkbox" />
                                Enable sound
                            </label>
                        </div>
                    </div>

                    <div class="category">
                        <h3 onclick="toggleCategory(this)">Display</h3>

                        <div class="category-content">
                            <label>
                                <input type="checkbox" />
                                Dark mode
                            </label>

                            <label>
                                <input type="checkbox" />
                                Compact layout
                            </label>
                        </div>
                    </div>
                </section>

                <!-- Page 2 -->
                <section class="modal-page hidden" id="chars-checklist">
                    <div class="category">
                        <h3 onclick="toggleCategory(this)">Nijisanji</h3>

                        <div class="category-content">
                            <label>
                                <input type="checkbox" />
                                EN
                            </label>

                            <label>
                                <input type="checkbox" />
                                ID
                            </label>

                            <label>
                                <input type="checkbox" />
                                JP
                            </label>
                        </div>
                    </div>

                    <div class="category">
                        <h3 onclick="toggleCategory(this)">Generation</h3>

                        <div class="category-content">
                            <label>
                                <input type="checkbox" />
                                First Generation
                            </label>

                            <label>
                                <input type="checkbox" />
                                Second Generation
                            </label>

                            <label>
                                <input type="checkbox" />
                                Third Generation
                            </label>
                        </div>
                    </div>
                </section>
                <section>
                    <div id="manual-config" class="settings-page hidden">
                        <h2>Character Sources</h2>

                        <div id="source-groups"></div>
                    </div>
                </section>
            </div>
        </div>

        <script src="guessGeneral.js"></script>
        <script src="guessDaily.js"></script>
        <!-- <script src="script.js"></script> -->
        <script src="modal.js"></script>
    </body>
</html>
